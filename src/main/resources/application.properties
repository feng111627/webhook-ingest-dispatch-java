# 本地默认端口；测试中由 properties 覆盖为随机端口
server.port=8080

# 签名密钥（本地演示用，生产请通过环境变量覆盖）
webhook.security.secret=local-dev-secret
# 时间戳容忍窗口（秒）：偏差超过该值（过去或未来）即判定 TIMESTAMP_EXPIRED
webhook.security.timestamp-tolerance-seconds=300

# 重试：最大处理次数（含首次）、首退避、倍数、上限
webhook.retry.max-attempts=3
webhook.retry.initial-backoff-ms=1000
webhook.retry.backoff-multiplier=2.0
webhook.retry.max-backoff-ms=30000

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n
